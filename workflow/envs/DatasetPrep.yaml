name: DatasetPrep
channels:
    - conda-forge
    - bioconda
    - r


dependencies: #by chatbot
  - r-base=4.3
  - r-argparse
  - r-dplyr = 1.1.*
  - r-readr=2.1.*
  - r-magrittr = 2.0.3
  - r-colorspace = 2.1_1
  #- r-farver = 2.1.2
  - r-geosphere
  - r-ade4
  - r-countrycode = 1.6.1
  - r-rnaturalearth
  - r-spacesXYZ
  - r-raster              # keep only if your script uses raster
  - r-sf=1.0.*           # modern sf
  - r-sfheaders
  - r-CoordinateCleaner
  - r-tidyr
  - r-sp
  - r-terra
  - r-devtools
  - r-rcpp
  # For GeoThinneR
  - r-data.table
  - r-doparallel
  - r-fields
  - r-foreach
  - r-matrixstats
  - r-nabor
  # spatial libs required by sf:
 # - gdal
  #- proj
  #- geos
  #- sqlite
  #- libxml2
  # optional; only if you truly need 3D plotting:
  # - r-rgl


